name: Restore ROCK product images safely

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Check restore marker
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          required="ROCK product catalog images restored untouched from original sources."
          if [ -f .rock-product-images-cleaned ] && grep -Fxq "$required" .rock-product-images-cleaned; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore original product images without processing
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SHA="4077755e3579d58270f89fb4c183a7708aebd767"
          git fetch --no-tags --depth=1 origin "$ORIGINAL_SHA"
          git restore --source="$ORIGINAL_SHA" -- assets/products/*.webp

      - name: Verify image files
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          count=$(find assets/products -maxdepth 1 -type f -name '*.webp' | wc -l)
          echo "Product image files: $count"
          test "$count" -ge 60

      - name: Commit restored originals
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'ROCK product catalog images restored untouched from original sources.\n' > .rock-product-images-cleaned
          git add assets/products/*.webp .rock-product-images-cleaned
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore untouched original ROCK product images"
          git push origin HEAD:main
