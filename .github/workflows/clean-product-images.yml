name: One-time clean ROCK product images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Check cleanup marker
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          required="ROCK product catalog images cleaned v4 from original sources."
          if [ -f .rock-product-images-cleaned ] && grep -Fxq "$required" .rock-product-images-cleaned; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install image cleanup dependencies
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install --upgrade pip && python -m pip install "Pillow>=10" "rembg[cpu]>=2.0.50"

      - name: Restore original catalog images
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SHA="4077755e3579d58270f89fb4c183a7708aebd767"
          git fetch --no-tags --depth=1 origin "$ORIGINAL_SHA"
          git restore --source="$ORIGINAL_SHA" -- assets/products/*.webp

      - name: Smoke-test charger cutouts
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import deque
          from math import hypot
          from pathlib import Path
          from PIL import Image, ImageChops, ImageFilter
          from rembg import new_session, remove

          ROOT = Path('assets/products')
          TEST = [ROOT/'rkch720.webp', ROOT/'rkch735.webp', ROOT/'rkch765.webp']
          TH = 24

          def components(alpha):
              w,h=alpha.size; px=alpha.load(); seen=bytearray(w*h)
              for y in range(h):
                  for x in range(w):
                      i=y*w+x
                      if seen[i] or px[x,y]<TH: continue
                      q=deque([(x,y)]); seen[i]=1; pts=[]; x1=x2=x; y1=y2=y
                      while q:
                          cx,cy=q.popleft(); pts.append((cx,cy)); x1=min(x1,cx); x2=max(x2,cx); y1=min(y1,cy); y2=max(y2,cy)
                          for nx,ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0<=nx<w and 0<=ny<h:
                                  ni=ny*w+nx
                                  if not seen[ni] and px[nx,ny]>=TH: seen[ni]=1; q.append((nx,ny))
                      yield {'area':len(pts),'bbox':(x1,y1,x2+1,y2+1),'center':((x1+x2)/2,(y1+y2)/2),'points':pts}

          def mask(alpha):
              w,h=alpha.size; binary=alpha.point(lambda v:255 if v>=TH else 0)
              core=binary.filter(ImageFilter.MinFilter(9)).filter(ImageFilter.MaxFilter(7))
              comps=list(components(core))
              if not comps: return binary
              cx,cy=w/2,h/2; diag=hypot(w,h)
              central=[c for c in comps if hypot(c['center'][0]-cx,c['center'][1]-cy)<=diag*.42] or comps
              anchor=max(central,key=lambda c:c['area'])
              x1,y1,x2,y2=anchor['bbox']; dx=max(18,int((x2-x1)*.16)); dy=max(18,int((y2-y1)*.16))
              x1=max(0,x1-dx); y1=max(0,y1-dy); x2=min(w,x2+dx); y2=min(h,y2+dy)
              region=Image.new('L',(w,h),0); region.paste(255,(x1,y1,x2,y2))
              kept=ImageChops.multiply(binary,region).filter(ImageFilter.MaxFilter(3)).filter(ImageFilter.MinFilter(3))
              return kept

          session=new_session('isnet-general-use')
          for path in TEST:
              image=remove(Image.open(path).convert('RGB'),session=session,alpha_matting=False,post_process_mask=True).convert('RGBA')
              image.putalpha(mask(image.getchannel('A')))
              if image.getchannel('A').getbbox() is None: raise SystemExit(f'Empty smoke-test result: {path}')
              image.save('/tmp/'+path.name,'WEBP',lossless=True)
              print('SMOKE OK',path)
          PY

      - name: Rebuild clean product images
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import deque
          from math import hypot
          from pathlib import Path
          from PIL import Image, ImageChops, ImageFilter
          from rembg import new_session, remove

          ROOT=Path('assets/products'); TH=24; PADDING=24

          def components(alpha):
              w,h=alpha.size; px=alpha.load(); seen=bytearray(w*h)
              for y in range(h):
                  for x in range(w):
                      i=y*w+x
                      if seen[i] or px[x,y]<TH: continue
                      q=deque([(x,y)]); seen[i]=1; pts=[]; x1=x2=x; y1=y2=y
                      while q:
                          cx,cy=q.popleft(); pts.append((cx,cy)); x1=min(x1,cx); x2=max(x2,cx); y1=min(y1,cy); y2=max(y2,cy)
                          for nx,ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0<=nx<w and 0<=ny<h:
                                  ni=ny*w+nx
                                  if not seen[ni] and px[nx,ny]>=TH: seen[ni]=1; q.append((nx,ny))
                      yield {'area':len(pts),'bbox':(x1,y1,x2+1,y2+1),'center':((x1+x2)/2,(y1+y2)/2),'points':pts}

          def clean(alpha):
              w,h=alpha.size; binary=alpha.point(lambda v:255 if v>=TH else 0)
              core=binary.filter(ImageFilter.MinFilter(9)).filter(ImageFilter.MaxFilter(7))
              comps=list(components(core))
              if not comps: return binary
              cx,cy=w/2,h/2; diag=hypot(w,h)
              central=[c for c in comps if hypot(c['center'][0]-cx,c['center'][1]-cy)<=diag*.42] or comps
              anchor=max(central,key=lambda c:c['area'])
              x1,y1,x2,y2=anchor['bbox']; dx=max(18,int((x2-x1)*.16)); dy=max(18,int((y2-y1)*.16))
              region=Image.new('L',(w,h),0); region.paste(255,(max(0,x1-dx),max(0,y1-dy),min(w,x2+dx),min(h,y2+dy)))
              kept=ImageChops.multiply(binary,region).filter(ImageFilter.MaxFilter(3)).filter(ImageFilter.MinFilter(3))
              return kept

          def fit(image):
              bbox=image.getchannel('A').getbbox()
              if not bbox: raise RuntimeError('No product foreground')
              l,t,r,b=bbox; l=max(0,l-PADDING); t=max(0,t-PADDING); r=min(image.width,r+PADDING); b=min(image.height,b+PADDING)
              crop=image.crop((l,t,r,b)); side=max(crop.size); out=Image.new('RGBA',(side,side),(0,0,0,0)); out.alpha_composite(crop,((side-crop.width)//2,(side-crop.height)//2)); out.thumbnail((1200,1200),Image.Resampling.LANCZOS); return out

          files=sorted(ROOT.glob('*.webp'))
          if len(files)<60: raise SystemExit(f'Unexpected product image count: {len(files)}')
          session=new_session('isnet-general-use')
          for i,path in enumerate(files,1):
              image=remove(Image.open(path).convert('RGB'),session=session,alpha_matting=False,post_process_mask=True).convert('RGBA')
              image.putalpha(clean(image.getchannel('A'))); image=fit(image); image.save(path,'WEBP',lossless=True,method=6)
              alpha=image.getchannel('A'); transparent=sum(v==0 for v in alpha.getdata())/(image.width*image.height)
              if alpha.getbbox() is None or transparent<.05: raise RuntimeError(f'Validation failed: {path} transparent={transparent:.1%}')
              print(f'REBUILT {i}/{len(files)} {path} transparent={transparent:.1%}')
          print(f'REBUILT ALL {len(files)}')
          PY

      - name: Validate rebuilt images
        if: steps.guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path('assets/products').glob('*.webp'))
          assert len(files)>=60, len(files)
          for path in files:
              with Image.open(path) as im:
                  im=im.convert('RGBA'); a=im.getchannel('A'); ratio=sum(v==0 for v in a.getdata())/(im.width*im.height)
                  if not a.getbbox() or ratio<.05: raise SystemExit(f'Bad image {path}: transparent={ratio:.1%}')
          print(f'Validated rebuilt product images: {len(files)}')
          PY

      - name: Commit rebuilt product images
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'ROCK product catalog images cleaned v4 from original sources.\n' > .rock-product-images-cleaned
          git add assets/products/*.webp .rock-product-images-cleaned
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: rebuild ROCK product images cleanly from original sources"
          git push origin HEAD:main
