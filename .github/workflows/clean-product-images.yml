name: One-time clean ROCK product images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Check cleanup marker
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          required="ROCK product catalog images cleaned v5 from original sources."
          if [ -f .rock-product-images-cleaned ] && grep -Fxq "$required" .rock-product-images-cleaned; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install image cleanup dependencies
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install --upgrade pip && python -m pip install "Pillow>=10" "rembg[cpu]>=2.0.50"

      - name: Restore original catalog images
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SHA="4077755e3579d58270f89fb4c183a7708aebd767"
          git fetch --no-tags --depth=1 origin "$ORIGINAL_SHA"
          git restore --source="$ORIGINAL_SHA" -- assets/products/*.webp

      - name: Smoke-test charger silhouettes
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from rembg import new_session, remove

          ROOT = Path('assets/products')
          TEST = [ROOT/'rkch720.webp', ROOT/'rkch735.webp', ROOT/'rkch765.webp']
          session = new_session('isnet-general-use')

          for path in TEST:
              with Image.open(path) as original:
                  original = original.convert('RGB')
                  src_size = original.size
                  result = remove(original, session=session, alpha_matting=False, post_process_mask=True).convert('RGBA')
                  if result.size != src_size:
                      raise SystemExit(f'Dimension mismatch for {path}: source={src_size} result={result.size}')
                  alpha = result.getchannel('A')
                  if alpha.getbbox() is None:
                      raise SystemExit(f'Empty smoke-test result: {path}')
                  transparent = sum(v == 0 for v in alpha.getdata()) / (result.width * result.height)
                  if transparent < 0.05:
                      raise SystemExit(f'Insufficient transparency for {path}: {transparent:.1%}')
                  print(f'SMOKE OK {path} source={src_size} output={result.size} transparent={transparent:.1%}')
          PY

      - name: Rebuild clean product images
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance
          from rembg import new_session, remove

          ROOT = Path('assets/products')
          THRESHOLD = 8
          files = sorted(ROOT.glob('*.webp'))
          if len(files) < 60:
              raise SystemExit(f'Unexpected product image count: {len(files)}')

          session = new_session('isnet-general-use')

          for i, path in enumerate(files, 1):
              with Image.open(path) as original:
                  original = original.convert('RGB')
                  src_size = original.size
                  result = remove(original, session=session, alpha_matting=False, post_process_mask=True).convert('RGBA')

              if result.size != src_size:
                  raise RuntimeError(f'Dimension mismatch {path}: source={src_size} result={result.size}')

              alpha = result.getchannel('A')
              # Keep the complete rembg silhouette on the original canvas.
              # Only clear extremely faint edge noise; never crop to a component bounding box.
              alpha = alpha.point(lambda v: 0 if v < THRESHOLD else v)
              result.putalpha(alpha)

              bbox = alpha.getbbox()
              if bbox is None:
                  raise RuntimeError(f'No product foreground: {path}')

              transparent = sum(v == 0 for v in alpha.getdata()) / (result.width * result.height)
              if transparent < 0.05:
                  raise RuntimeError(f'Insufficient transparency {path}: {transparent:.1%}')

              result.save(path, 'WEBP', lossless=True, method=6)
              print(f'REBUILT {i}/{len(files)} {path} source={src_size} output={result.size} bbox={bbox} transparent={transparent:.1%}')

          print(f'REBUILT ALL {len(files)}')
          PY

      - name: Build visual inspection sheet
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          files = sorted(Path('assets/products').glob('*.webp'))
          tile_w, tile_h = 220, 180
          cols = 5
          rows = (len(files) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * tile_w, rows * tile_h), 'white')

          for i, path in enumerate(files):
              with Image.open(path).convert('RGBA') as im:
                  card = Image.new('RGB', (tile_w, tile_h), 'white')
                  thumb = im.copy()
                  thumb.thumbnail((200, 140), Image.Resampling.LANCZOS)
                  x = (tile_w - thumb.width) // 2
                  y = 8 + (140 - thumb.height) // 2
                  card.paste(thumb, (x, y), thumb)
                  ImageDraw.Draw(card).text((6, 156), path.stem, fill='black')
                  sheet.paste(card, ((i % cols) * tile_w, (i // cols) * tile_h))

          Path('/tmp').mkdir(parents=True, exist_ok=True)
          sheet.save('/tmp/rock-product-images-v5-contact.jpg', quality=92)
          PY

      - name: Validate rebuilt images and dimensions
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('assets/products').glob('*.webp'))
          assert len(files) >= 60, len(files)
          for path in files:
              with Image.open(path) as im:
                  im = im.convert('RGBA')
                  alpha = im.getchannel('A')
                  ratio = sum(v == 0 for v in alpha.getdata()) / (im.width * im.height)
                  if not alpha.getbbox() or ratio < 0.05:
                      raise SystemExit(f'Bad image {path}: size={im.size} transparent={ratio:.1%}')
          print(f'Validated rebuilt product images: {len(files)} with original source canvas dimensions preserved')
          PY

      - name: Commit rebuilt product images
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'ROCK product catalog images cleaned v5 from original sources.\n' > .rock-product-images-cleaned
          git add assets/products/*.webp .rock-product-images-cleaned
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: rebuild ROCK product images without silhouette cropping"
          git push origin HEAD:main
