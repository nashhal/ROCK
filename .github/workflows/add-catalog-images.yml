name: Build catalog product images
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-catalog-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        run: python -m pip install --quiet pymupdf pillow
      - name: Render product images from catalog PDF and wire them into the store
        shell: python
        run: |
          import fitz, os, re
          from PIL import Image

          pdf='1789300982120_ROCK_To_FUN (1).pdf'
          doc=fitz.open(pdf)
          out_dir='assets/products'
          os.makedirs(out_dir, exist_ok=True)

          page_map={
            'eb200':8,'s1':10,'eb710':12,'eb500':14,'x718':16,'eb600':18,'retro-tws':20,
            'a5pro':22,'eb800':24,'ultra-ow':26,'pro-ow':28,'retro-mix':30,'eb700':32,'eb900':34,
            'pods700':36,'hp85':38,'h2':40,'h3':42,'y6':45,'es09':47,'ro0546t':49,'aux139':53,
            'rkch765':58,'rkch735':60,'rkch720':62,'retract70':64,'wallpb10k':66,'p56':75,'p28':80,
            'retro-mag10k':84,'y18':86,'fridge20k':86,'gan30pb':88,'powersack10k':92,'magholder10k':94,
            'travel10k':96,'metal3in1':99,'cc60':101,'c60l27':103,'a60c':105,'a5c':107,'c27l':109,
            'a12l':111,'a12m':113,'car30':116,'b301':118,'sd017':120,'nc20':122,'s5':125,
            'fabric-speaker':127,'rph1000':130,'ram0037':132,'w22':134,'rph0876':136,'rph1003':138,
            'rph0878':140,'w31':142,'vacuum-cup':144,'laptop-bag':147,'trimmer':149,'car-aroma':151,
            'punk-bag':153,'pen':155
          }

          for pid, page_no in page_map.items():
              page=doc[page_no-1]
              pix=page.get_pixmap(matrix=fitz.Matrix(1.35,1.35), alpha=False)
              img=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
              crop_w=int(img.width*0.58)
              crop=img.crop((0,0,crop_w,img.height))
              crop.thumbnail((900,900),Image.Resampling.LANCZOS)
              crop.save(os.path.join(out_dir,pid+'.webp'),'WEBP',quality=86,method=6)

          path='script.js'
          text=open(path,encoding='utf-8').read()
          for pid in page_map:
              text=text.replace("{id:'%s'," % pid, "{id:'%s',image:'assets/products/%s.webp'," % (pid,pid), 1)

          text=text.replace(
              '<div class="product-art ${p.art}"></div>',
              '<div class="product-art ${p.art} has-catalog-image"><img class="product-image" src="${p.image}" alt="${p.name}" loading="lazy"></div>'
          )
          text=text.replace(
              '<div class="modal-art product-art ${p.art}"></div>',
              '<div class="modal-art product-art ${p.art} has-catalog-image"><img class="product-image" src="${p.image}" alt="${p.name}" loading="lazy"></div>'
          )
          open(path,'w',encoding='utf-8').write(text)

          css='''\n/* Product photos rendered from the ROCK catalog PDF */\n.product-art.has-catalog-image { background: #fff !important; overflow: hidden; display:flex; align-items:center; justify-content:center; }\n.product-art.has-catalog-image::before, .product-art.has-catalog-image::after { content:none !important; display:none !important; }\n.product-art.has-catalog-image .product-image { width:100%; height:100%; object-fit:contain; display:block; position:relative; z-index:2; }\n'''
          with open('enhancements.css','a',encoding='utf-8') as f: f.write(css)

          index='index.html'
          html=open(index,encoding='utf-8').read()
          html=html.replace('script.js?v=20260913-6','script.js?v=20260913-7')
          html=html.replace('enhancements.css?v=20260913-6','enhancements.css?v=20260913-7')
          open(index,'w',encoding='utf-8').write(html)
      - name: Commit generated images and wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/products script.js enhancements.css index.html
          git commit -m 'Add source catalog product images to storefront'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/add-catalog-images.yml
          git add .github/workflows/add-catalog-images.yml
          git commit -m 'Remove temporary catalog image workflow'
          git push