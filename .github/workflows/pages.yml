name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare calm motion system
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'calm-motion.css?v=20260913-1' not in s:
              marker = '  <link rel="stylesheet" href="logo-system.css?v=20260913-1">'
              if marker not in s:
                  raise SystemExit("logo stylesheet marker not found")
              s = s.replace(marker, marker + '\n  <link rel="stylesheet" href="calm-motion.css?v=20260913-1">', 1)
          if "document.documentElement.classList.add('motion-ready')" not in s:
              marker = '  <script type="application/ld+json">'
              if marker not in s:
                  raise SystemExit("JSON-LD marker not found")
              s = s.replace(marker, "  <script>document.documentElement.classList.add('motion-ready');</script>\n" + marker, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install complete bilingual interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tag = '  <script src="i18n.js?v=20260913-1"></script>'
          if tag not in s:
              start = s.find('  <script src="script.js')
              if start < 0:
                  raise SystemExit("main script tag not found")
              end = s.find('</script>', start)
              if end < 0:
                  raise SystemExit("main script closing tag not found")
              end += len('</script>')
              s = s[:end] + '\n' + tag + s[end:]
          p.write_text(s, encoding="utf-8")
          PY

      - name: Repair critical UI bindings before deploy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          if 'id="overlay"' not in s:
              marker = '  <div class="search-overlay" id="searchOverlay"'
              replacement = '  <div class="overlay" id="overlay"></div>\n' + marker
              if marker not in s:
                  raise SystemExit("search overlay marker not found")
              s = s.replace(marker, replacement, 1)

          if 'data-rock-mobile-bindings' not in s:
              start = s.find('  <script src="script.js')
              if start < 0:
                  raise SystemExit("main script tag not found")
              end = s.find('</script>', start)
              if end < 0:
                  raise SystemExit("main script closing tag not found")
              end += len('</script>')
              patch = '''\n  <script data-rock-mobile-bindings>\n  (()=>{\n    document.querySelectorAll('[data-jump]').forEach(btn=>btn.addEventListener('click',()=>{\n      const target=document.querySelector(btn.dataset.jump);\n      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});\n    }));\n    const mobileCart=document.getElementById('mobileCart');\n    const cartBtn=document.getElementById('cartBtn');\n    if(mobileCart&&cartBtn) mobileCart.addEventListener('click',()=>cartBtn.click());\n    const mobileSearch=document.getElementById('mobileSearch');\n    const searchBtn=document.getElementById('searchBtn');\n    if(mobileSearch&&searchBtn) mobileSearch.addEventListener('click',()=>searchBtn.click());\n  })();\n  </script>'''
              s = s[:end] + patch + s[end:]

          if 'image-fix.js?' not in s:
              start = s.find('  <script src="script.js')
              if start < 0:
                  raise SystemExit("main script tag not found")
              end = s.find('</script>', start)
              if end < 0:
                  raise SystemExit("main script closing tag not found")
              end += len('</script>')
              s = s[:end] + '\n  <script src="image-fix.js?v=20260913-12"></script>' + s[end:]

          p.write_text(s, encoding="utf-8")
          PY

      - name: Extract original ROCK catalog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p catalog-extract
          pdftotext -layout "1789300982120_ROCK_To_FUN (1).pdf" catalog-extract/catalog.txt || true
          pdfinfo "1789300982120_ROCK_To_FUN (1).pdf" > catalog-extract/pdfinfo.txt
          cp "1789300982120_ROCK_To_FUN (1).pdf" catalog-extract/

      - name: Diagnose ROCK product image references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          js = Path('script.js').read_text(encoding='utf-8')
          refs = sorted(set(re.findall(r'assets/products/[A-Za-z0-9._-]+\.webp', js)))
          files = {str(p) for p in Path('assets/products').glob('*.webp')}
          missing = [p for p in refs if p not in files]
          print(f'Product image references: {len(refs)}')
          print(f'Product image files present: {len(refs)-len(missing)}')
          print(f'Missing product images: {len(missing)}')
          for p in missing:
              print(f'MISSING {p}')
          print('--- available asset sample ---')
          for p in sorted(files)[:250]:
              print(p)
          PY

      - name: Validate ROCK source, JavaScript and product images
        run: |
          set -e
          test -s "rock_logo (1).svg"
          test -s "calm-motion.css"
          test -s "i18n.js"
          test -s "image-fix.js"
          test -s "1789300982120_ROCK_To_FUN (1).pdf"
          test -s "catalog-extract/catalog.txt"
          grep -q 'rock_logo%20(1).svg' index.html
          grep -q 'calm-motion.css?v=20260913-1' index.html
          grep -q 'i18n.js?v=20260913-1' index.html
          grep -q 'image-fix.js?v=20260913-12' index.html
          grep -q 'id="overlay"' index.html
          grep -q 'data-rock-mobile-bindings' index.html
          grep -q 'id="mobileCart"' index.html
          grep -q 'id="mobileSearch"' index.html
          grep -q 'id="cartBtn"' index.html
          grep -q 'id="searchBtn"' index.html
          grep -q 'id="cartDrawer"' index.html
          grep -q 'id="productGrid"' index.html
          grep -q 'id="finderModal"' index.html
          node --check script.js
          node --check i18n.js
          node --check image-fix.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('script.js').read_text(encoding='utf-8')
          refs = set(re.findall(r'assets/products/[A-Za-z0-9._-]+\.webp', js))
          missing = sorted(p for p in refs if not Path(p).is_file())
          print(f'Product image references: {len(refs)}')
          print(f'Product image files present: {len(refs)-len(missing)}')
          if missing:
              print('Missing product images:')
              for p in missing: print(p)
              raise SystemExit(1)
          if 'image-fix.js?v=20260913-12' not in html:
              raise SystemExit('image-fix.js is not included in the deployed HTML')
          PY

      - name: Upload catalog extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: rock-catalog-extraction
          path: catalog-extract/
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
