name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate committed storefront
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html product.html styles.css enhancements.css logo-system.css rock-brand.css rock-cards.css rock-vnext.css brand-system.css navy-brand.css global-commerce.css script.js catalog-pricing.js excel-catalog-only.js image-fix.js rock-performance.js rock-i18n.js config/store.config.js global-commerce.js product-page.js product-page.css product-linker.js seo-layer.js rock-identity.js scripts/prepare_product_images.py; do
            test -f "$file"
          done
          echo "Validated ROCK storefront files."
          grep -q 'product.html' product-linker.js
          grep -q 'ROCK_CONFIG' config/store.config.js
          grep -q 'application/ld+json' product-page.js
          grep -q 'navy-brand.css' index.html
          grep -q 'rock-i18n.js' index.html

      - name: Validate local HTML assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          files = [Path('index.html'), Path('product.html')]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('src', 'href'):
                      value = attrs.get(key)
                      if not value or value.startswith(('http://', 'https://', 'data:', '#', 'mailto:', 'javascript:')):
                          continue
                      self.refs.append(unquote(value.split('?', 1)[0].split('#', 1)[0]))

          refs = []
          for file in files:
              parser = Parser()
              parser.feed(file.read_text(encoding='utf-8'))
              refs += parser.refs

          missing = sorted({ref for ref in refs if ref and not Path(ref).is_file()})
          if missing:
              print('Missing local HTML assets:')
              print('\n'.join(missing))
              raise SystemExit(1)

          print(f'Validated local HTML assets: {len(set(refs))}')
          PY

      - name: Validate ROCK product images
        shell: bash
        run: |
          set -euo pipefail
          refs=$(grep -oE "assets/products/[A-Za-z0-9._-]+\.webp" script.js | sort -u || true)
          count=0
          missing=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            count=$((count + 1))
            if [ ! -f "$path" ]; then
              echo "MISSING PRODUCT IMAGE: $path"
              missing=$((missing + 1))
            fi
          done <<< "$refs"
          echo "Verified product image references: $count"
          echo "Missing product images: $missing"
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in script.js catalog-pricing.js excel-catalog-only.js image-fix.js global-commerce.js rock-performance.js rock-i18n.js product-page.js product-linker.js seo-layer.js rock-identity.js; do
            node --check "$file"
          done
          if [ -f i18n.js ]; then node --check i18n.js; fi

      - name: Prepare product images for cards
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          python scripts/prepare_product_images.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
