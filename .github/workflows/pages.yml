name: Deploy ROCK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate storefront
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image-validation dependencies
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Install browser regression-test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate source and catalog
        run: |
          python -m py_compile scripts/sync_drive_photos.py scripts/test_sync_drive_photos.py
          python scripts/test_sync_drive_photos.py
          node --check app.js
          node --check products.js
          node --check rocky-assistant.js
          node --check product-page.js
          node --check policy-page.js
          node --check scripts/validate_storefront.js
          node scripts/validate_storefront.js
      - name: Run storefront browser regression tests
        run: npx playwright test

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync official product photo galleries
        run: |
          python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
          python scripts/sync_drive_photos.py
      - name: Validate generated storefront
        run: |
          python -m py_compile scripts/sync_drive_photos.py scripts/test_sync_drive_photos.py
          python scripts/test_sync_drive_photos.py
          node --check app.js
          node --check products.js
          node --check rocky-assistant.js
          node --check product-page.js
          node --check policy-page.js
          node --check scripts/validate_storefront.js
          node scripts/validate_storefront.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
