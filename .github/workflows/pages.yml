name: Deploy ROCK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean storefront
        run: |
          test -f index.html
          test -f styles.css
          test -f products.js
          test -f app.js
          test -f assets/brand/rock-logo.svg
          test -d assets/products
          test -f '1789300982120_ROCK_To_FUN (1).pdf'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
