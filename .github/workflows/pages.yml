name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify storefront
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f products.js
          test -f app.js
          test -f assets/brand/rock-logo.svg
          test -d assets/products
          grep -q "ROCK_PRODUCTS" products.js
          grep -q "Google Fonts" index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
