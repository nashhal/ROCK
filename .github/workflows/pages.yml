name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache product segmentation model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rock-u2net-${{ runner.os }}-v1

      - name: Prepare safe transparent product cutouts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'rembg[cpu]==2.0.84' Pillow
          python scripts/prepare_product_media.py

      - name: Sanitize deployment HTML and load ROCK brand layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if 'interactions.js' not in line and 'mobile.js' not in line]
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          for version in ('20260913-8','20260913-9','20260913-10'):
              text = text.replace(f'script.js?v={version}', 'script.js?v=20260913-11')
          for version in ('20260913-8','20260913-9','20260913-10'):
              text = text.replace(f'enhancements.css?v={version}', 'enhancements.css?v=20260913-11')
          for version in ('20260913-21','20260913-22','20260913-23','20260913-30','20260913-31','20260913-32','20260913-33','20260913-34','20260913-35'):
              text = text.replace(f'image-fix.js?v={version}', 'image-fix.js?v=20260913-36')
          if 'rock-brand.css?v=20260913-1' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="rock-brand.css?v=20260913-1">\n</head>')
          path.write_text(text, encoding='utf-8')
          print('ROCK visual brand layer enabled in deployment artifact.')
          PY

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ('src','href'):
                      value=attrs.get(key)
                      if not value or value.startswith(('http://','https://','data:','#','mailto:','javascript:')):
                          continue
                      self.refs.append(unquote(value.split('?',1)[0].split('#',1)[0]))

          p=Parser()
          p.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=sorted({ref for ref in p.refs if not Path(ref).is_file()})
          if missing:
              print('Missing local HTML assets:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Validated local HTML assets: {len(set(p.refs))}')
          PY

      - name: Validate ROCK product images
        shell: bash
        run: |
          set -euo pipefail
          test -f script.js
          test -f image-fix.js
          test -f rock-brand.css
          test -f scripts/prepare_product_media.py
          test -d assets/products
          refs=$(grep -oE "assets/products/[A-Za-z0-9._-]+\.webp" script.js | sort -u)
          count=0
          missing=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            count=$((count + 1))
            if [ ! -f "$path" ]; then
              echo "MISSING PRODUCT IMAGE: $path"
              missing=$((missing + 1))
            fi
          done <<< "$refs"
          echo "Verified product image references: $count"
          echo "Missing product images: $missing"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check image-fix.js
          if [ -f i18n.js ]; then node --check i18n.js; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
