name: Deploy ROCK

on:
  push:
    branches: [main, feat/order-management]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate storefront
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP for Hostinger backend checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_mysql, mbstring
          coverage: none
      - name: Install image-validation dependencies
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Validate source and catalog
        run: |
          php -l api/bootstrap.php
          php -l api/image-quality.php
          php -l api/products.php
          php -l api/install.php
          php -l admin/index.php
          php -l admin/api.php
          php -l scripts/test_hostinger_admin.php
          php scripts/test_hostinger_admin.php
          python -m py_compile scripts/sync_drive_photos.py scripts/test_sync_drive_photos.py scripts/product_image_quality.py scripts/test_product_image_quality.py
          python scripts/test_sync_drive_photos.py
          python scripts/test_product_image_quality.py
          python scripts/product_image_quality.py
          node --check admin/admin.js
          node --check app.js
          node --check products.js
          node --check rocky-assistant.js
          node --check product-page.js
          node --check policy-page.js
          node --check scripts/validate_storefront.js
          node --check scripts/test_storefront_browser.cjs
          node scripts/validate_storefront.js

  browser-regression:
    name: Browser regression and screenshots
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install photo quality dependencies
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Build approved product photo list
        run: |
          python scripts/test_product_image_quality.py
          python scripts/product_image_quality.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser checks
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/rock-storefront-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          node scripts/test_storefront_browser.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-storefront-browser-review-${{ github.run_number }}
          path: .artifacts/storefront/
          if-no-files-found: ignore
          retention-days: 14

  package-source:
    name: Package reviewed ROCK source
    if: github.event_name == 'pull_request'
    needs: [validate, browser-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare generated catalog quality manifest
        run: |
          python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
          python scripts/test_product_image_quality.py
          python scripts/product_image_quality.py
      - name: Build source ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/ROCK"
          git archive --format=tar --prefix=ROCK/ HEAD | tar -xf - -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ROCK/data"
          cp data/product-image-quality.js "$RUNNER_TEMP/ROCK/data/product-image-quality.js"
          cp sitemap.xml "$RUNNER_TEMP/ROCK/sitemap.xml"
          (cd "$RUNNER_TEMP" && zip -qr ROCK-source.zip ROCK)
          sha256sum "$RUNNER_TEMP/ROCK-source.zip"
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: rock-source-package-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/ROCK-source.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/order-management')
    needs: [validate, browser-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP for Hostinger backend checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, pdo_mysql, mbstring
          coverage: none
      - name: Sync official product photo galleries
        if: github.ref == 'refs/heads/main'
        run: |
          python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
          python scripts/sync_drive_photos.py
          python scripts/test_product_image_quality.py
          python scripts/product_image_quality.py
      - name: Prepare local gallery manifest for development preview
        if: github.ref == 'refs/heads/feat/order-management'
        run: |
          python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
          python scripts/test_product_image_quality.py
          python scripts/product_image_quality.py
      - name: Validate generated storefront
        run: |
          php -l api/bootstrap.php
          php -l api/image-quality.php
          php -l api/products.php
          php -l api/install.php
          php -l admin/index.php
          php -l admin/api.php
          php -l scripts/test_hostinger_admin.php
          php scripts/test_hostinger_admin.php
          python -m py_compile scripts/sync_drive_photos.py scripts/test_sync_drive_photos.py scripts/product_image_quality.py scripts/test_product_image_quality.py
          python scripts/test_sync_drive_photos.py
          python scripts/test_product_image_quality.py
          node --check admin/admin.js
          node --check app.js
          node --check products.js
          node --check rocky-assistant.js
          node --check product-page.js
          node --check policy-page.js
          node --check scripts/validate_storefront.js
          node --check scripts/test_storefront_browser.cjs
          node scripts/validate_storefront.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static GitHub Pages output
        run: |
          rm -rf _site
          mkdir -p _site
          cp ./*.html ./*.css ./*.js ./*.txt ./*.xml _site/
          cp -R assets data _site/
          test -f _site/index.html
          test -f _site/products.js
          test -f _site/data/product-image-quality.js
          if find _site -type f -name '*.php' | grep -q .; then
            echo "PHP source must never be published to static GitHub Pages."
            exit 1
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        uses: actions/deploy-pages@v4
