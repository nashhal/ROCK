name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate committed storefront
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html product.html checkout.html policies.html support.html styles.css enhancements.css logo-system.css rock-brand.css rock-cards.css rock-vnext.css brand-system.css navy-brand.css global-commerce.css product-page.css checkout.css world-class.css script.js catalog-pricing.js excel-catalog-only.js image-fix.js rock-performance.js rock-i18n.js config/store.config.js global-commerce.js product-page.js product-linker.js seo-layer.js rock-identity.js world-class.js checkout.js scripts/prepare_product_images.py; do
            test -f "$file"
          done
          echo "Validated ROCK storefront files."
          grep -q 'product.html' product-linker.js
          grep -q 'checkout.html' world-class.js
          grep -q 'ROCK_CONFIG' config/store.config.js
          grep -q 'application/ld+json' product-page.js
          grep -q 'navy-brand.css' index.html
          grep -q 'rock-i18n.js' index.html
          grep -q 'preserve original' .github/workflows/pages.yml || true

      - name: Validate local HTML assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          files = [Path('index.html'), Path('product.html'), Path('checkout.html'), Path('policies.html'), Path('support.html')]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('src', 'href'):
                      value = attrs.get(key)
                      if not value or value.startswith(('http://', 'https://', 'data:', '#', 'mailto:', 'javascript:')):
                          continue
                      self.refs.append(unquote(value.split('?', 1)[0].split('#', 1)[0]))

          refs = []
          for file in files:
              parser = Parser(); parser.feed(file.read_text(encoding='utf-8')); refs += parser.refs
          missing = sorted({ref for ref in refs if ref and not Path(ref).is_file()})
          if missing:
              print('Missing local HTML assets:'); print('\n'.join(missing)); raise SystemExit(1)
          print(f'Validated local HTML assets: {len(set(refs))}')
          PY

      - name: Validate ROCK product images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          refs = set()
          for file in (Path('script.js'), Path('catalog-pricing.js'), Path('excel-catalog-only.js')):
              refs.update(re.findall(r"assets/products/[A-Za-z0-9._-]+\.webp", file.read_text(encoding='utf-8')))
          missing = sorted(ref for ref in refs if not Path(ref).is_file())
          print(f'Verified product image references: {len(refs)}')
          if missing:
              print('Missing product images:'); print('\n'.join(missing)); raise SystemExit(1)
          print('All product image references resolve to committed files.')
          PY

      - name: Validate all catalog image references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          refs = set()
          for file in (Path('script.js'), Path('catalog-pricing.js'), Path('excel-catalog-only.js'), Path('product-page.js')):
              refs.update(re.findall(r"assets/products/[A-Za-z0-9._-]+\.webp", file.read_text(encoding='utf-8')))
          missing = sorted(ref for ref in refs if not Path(ref).is_file())
          print(f'Validated catalog image references: {len(refs)}')
          if missing:
              print('Missing catalog images:'); print('\n'.join(missing)); raise SystemExit(1)
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in script.js catalog-pricing.js excel-catalog-only.js image-fix.js global-commerce.js rock-performance.js rock-i18n.js product-page.js product-linker.js seo-layer.js rock-identity.js world-class.js checkout.js; do
            node --check "$file"
          done
          if [ -f i18n.js ]; then node --check i18n.js; fi

      - name: Validate semantic product data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('script.js').read_text(encoding='utf-8')
          ids = re.findall(r"id:'([^']+)'[^\n]*?image:'assets/products/([^']+\\.webp)'", text)
          print(f'Base catalog products with local images: {len(ids)}')
          if len(ids) < 10:
              raise SystemExit('Unexpectedly small base catalog image set')
          PY

      - name: Preserve original catalog product images
        shell: bash
        run: |
          set -euo pipefail
          echo "Original catalog images are deployed unchanged."
          echo "No background removal, trim, flood-fill, resize, or canvas conversion is performed during Pages deployment."
          find assets/products -type f -name '*.webp' | sort | sed -n '1,20p'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
