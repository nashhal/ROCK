name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare transparent product photography
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          root = Path('assets/products')
          files = sorted(root.glob('*.webp'))
          if not files:
              raise SystemExit('No product WebP files found')

          def is_background(r, g, b, a):
              if a == 0:
                  return False
              mx = max(r, g, b)
              mn = min(r, g, b)
              # Remove neutral/near-white pixels only when they are connected to the image edge.
              return mx >= 242 and (mx - mn) <= 18

          processed = 0
          for path in files:
              image = Image.open(path).convert('RGBA')
              w, h = image.size
              pixels = list(image.getdata())
              seen = bytearray(w * h)
              queue = deque()

              def seed(x, y):
                  p = y * w + x
                  if seen[p]:
                      return
                  r, g, b, a = pixels[p]
                  if is_background(r, g, b, a):
                      seen[p] = 1
                      queue.append(p)

              for x in range(w):
                  seed(x, 0)
                  seed(x, h - 1)
              for y in range(h):
                  seed(0, y)
                  seed(w - 1, y)

              while queue:
                  p = queue.popleft()
                  x = p % w
                  y = p // w
                  r, g, b, a = pixels[p]
                  pixels[p] = (r, g, b, 0)
                  if x:
                      seed(x - 1, y)
                  if x + 1 < w:
                      seed(x + 1, y)
                  if y:
                      seed(x, y - 1)
                  if y + 1 < h:
                      seed(x, y + 1)

              image.putdata(pixels)
              image.save(path, 'WEBP', lossless=True, method=6)
              processed += 1

          print(f'Normalized product photography: {processed} files')
          PY

      - name: Sanitize deployment HTML and load ROCK brand layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if 'interactions.js' not in line and 'mobile.js' not in line]
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          for version in ('20260913-21', '20260913-22', '20260913-23', '20260913-30', '20260913-31', '20260913-32'):
              text = text.replace(f'image-fix.js?v={version}', 'image-fix.js?v=20260913-33')
          if 'rock-brand.css?v=20260913-1' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="rock-brand.css?v=20260913-1">\n</head>')
          path.write_text(text, encoding='utf-8')
          print('ROCK visual brand layer enabled in deployment artifact.')
          PY

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ('src','href'):
                      value=attrs.get(key)
                      if not value or value.startswith(('http://','https://','data:','#','mailto:','javascript:')):
                          continue
                      self.refs.append(unquote(value.split('?',1)[0].split('#',1)[0]))

          p=Parser()
          p.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=sorted({ref for ref in p.refs if not Path(ref).is_file()})
          if missing:
              print('Missing local HTML assets:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Validated local HTML assets: {len(set(p.refs))}')
          PY

      - name: Validate ROCK product images
        shell: bash
        run: |
          set -euo pipefail
          test -f script.js
          test -f image-fix.js
          test -f rock-brand.css
          test -d assets/products
          refs=$(grep -oE "assets/products/[A-Za-z0-9._-]+\.webp" script.js | sort -u)
          count=0
          missing=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            count=$((count + 1))
            if [ ! -f "$path" ]; then
              echo "MISSING PRODUCT IMAGE: $path"
              missing=$((missing + 1))
            fi
          done <<< "$refs"
          echo "Verified product image references: $count"
          echo "Missing product images: $missing"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check image-fix.js
          if [ -f i18n.js ]; then node --check i18n.js; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
