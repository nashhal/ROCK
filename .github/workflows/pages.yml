name: Deploy ROCK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-gallery
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync original product photo galleries
        run: |
          python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
          python scripts/sync_drive_photos.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js assets/products
          if ! git diff --cached --quiet; then
            git commit -m "Sync original ROCK product photo galleries"
            git push origin HEAD:main
          else
            echo "Product photo galleries are already up to date."
          fi
      - name: Validate storefront
        run: |
          test -f index.html
          test -f product.html
          test -f product-page.css
          test -f product-page.js
          test -f policies.html
          test -f policy-page.js
          test -f styles.css
          test -f premium-refresh.css
          test -f app.js
          test -f products.js
          test -f rocky-assistant.js
          test -f rocky-assistant.css
          test -f assets/brand/rocky-mascot.svg
          test -f robots.txt
          test -f sitemap.xml
          test -f 404.html
          test -f assets/brand/rock-logo.svg
          test -d assets/products
          node --check app.js
          node --check products.js
          node --check rocky-assistant.js
          node --check product-page.js
          node --check policy-page.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { globalThis: {} };
          vm.runInNewContext(fs.readFileSync('products.js', 'utf8'), context);
          const products = context.globalThis.ROCK_PRODUCTS;
          if (!Array.isArray(products) || products.length < 1) throw new Error('No products found');
          const ids = new Set();
          const missingImages = [];
          for (const p of products) {
            if (!p.id || ids.has(p.id)) throw new Error('Missing or duplicate product id: ' + p.id);
            ids.add(p.id);
            if (!p.model || !p.nameAr || !p.nameEn || !Number.isFinite(p.price) || p.price < 0) throw new Error('Invalid product fields: ' + p.id);
            if (typeof p.image !== 'string' || !p.image.startsWith('assets/products/') || !p.image.endsWith('.webp') || !/^[a-z0-9-]+$/.test(p.image.slice(16, -5))) throw new Error('Invalid product image path: ' + p.id + ' -> ' + p.image);
            if (!fs.existsSync(p.image)) missingImages.push(p.id);
          }
          console.log('Validated ' + products.length + ' products and their image references.');
          if (missingImages.length) console.warn('Local product photos still need to be added for: ' + missingImages.join(', '));
          NODE
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html','product.html','policies.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
              const url = match[1];
              if (/^(https?:|mailto:|tel:|#|data:|javascript:)/i.test(url)) continue;
              const local = url.split('?')[0].split('#')[0];
              if (local && !fs.existsSync(local)) throw new Error(file + ' points to missing local file: ' + local);
            }
          }
          console.log('Validated local HTML asset links.');
          const productHtml = fs.readFileSync('product.html', 'utf8');
          if (productHtml.includes('id="detailPhotosLink"')) throw new Error('Product page exposes a Drive folder link');
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { globalThis: {} };
          vm.runInNewContext(fs.readFileSync('products.js', 'utf8'), context);
          const products = context.globalThis.ROCK_PRODUCTS;
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          for (const p of products) {
            const url = 'https://nashhal.github.io/ROCK/product.html?id=' + encodeURIComponent(p.id);
            if (!sitemap.includes('<loc>' + url + '</loc>')) throw new Error('Product missing from sitemap: ' + p.id);
          }
          if (!sitemap.includes('https://nashhal.github.io/ROCK/')) throw new Error('Homepage missing from sitemap');
          if (!fs.readFileSync('robots.txt', 'utf8').includes('Sitemap: https://nashhal.github.io/ROCK/sitemap.xml')) throw new Error('robots.txt sitemap reference missing');
          const productScript = fs.readFileSync('product-page.js', 'utf8');
          for (const token of ['schema.org','application/ld+json','og:title','link[rel="canonical"]']) {
            if (!productScript.includes(token)) throw new Error('Missing product SEO feature token: ' + token);
          }
          console.log('Validated sitemap URLs, robots.txt and product SEO for ' + products.length + ' products.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
