name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sanitize deployment HTML and bust asset cache
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          # Remove stale script references that do not exist in the repository.
          sed -i '/interactions\.js/d; /mobile\.js/d' index.html
          # Force the browser/CDN to fetch the current product-motion engine.
          sed -i 's/image-fix\.js?v=[^"'"']*/image-fix.js?v=20260913-23/g' index.html

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  for key in ('src','href'):
                      value=a.get(key)
                      if value and not value.startswith(('http://','https://','data:','#','mailto:','javascript:')):
                          self.refs.append(value.split('?',1)[0].split('#',1)[0])

          p=Parser()
          p.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=[]
          for ref in sorted(set(p.refs)):
              if ref.startswith('//'):
                  continue
              if not Path(ref).is_file():
                  missing.append(ref)
          if missing:
              print('Missing local HTML assets:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Validated local HTML assets: {len(set(p.refs))}')
          PY

      - name: Validate ROCK product images
        shell: bash
        run: |
          set -euo pipefail
          test -f script.js
          test -d assets/products
          refs=$(grep -oE "assets/products/[A-Za-z0-9._-]+\.webp" script.js | sort -u)
          count=0
          missing=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            count=$((count + 1))
            if [ ! -f "$path" ]; then
              echo "MISSING PRODUCT IMAGE: $path"
              missing=$((missing + 1))
            fi
          done <<< "$refs"
          echo "Verified product image references: $count"
          echo "Missing product images: $missing"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          if [ -f i18n.js ]; then node --check i18n.js; fi
          if [ -f image-fix.js ]; then node --check image-fix.js; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
