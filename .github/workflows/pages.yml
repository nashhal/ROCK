name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate committed storefront
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f enhancements.css
          test -f logo-system.css
          test -f rock-brand.css
          test -f script.js
          test -f image-fix.js
          echo "Deploying the committed ROCK storefront exactly as stored in main."
          grep -q 'enhancements.css' index.html
          grep -q 'logo-system.css' index.html
          grep -q 'script.js' index.html

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  for key in ('src','href'):
                      value=attrs.get(key)
                      if not value or value.startswith(('http://','https://','data:','#','mailto:','javascript:')):
                          continue
                      self.refs.append(unquote(value.split('?',1)[0].split('#',1)[0]))

          p=Parser()
          p.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=sorted({ref for ref in p.refs if not Path(ref).is_file()})
          if missing:
              print('Missing local HTML assets:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Validated local HTML assets: {len(set(p.refs))}')
          PY

      - name: Validate ROCK product images
        run: |
          set -euo pipefail
          refs=$(grep -oE "assets/products/[A-Za-z0-9._-]+\.webp" script.js | sort -u)
          count=0
          missing=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            count=$((count + 1))
            if [ ! -f "$path" ]; then
              echo "MISSING PRODUCT IMAGE: $path"
              missing=$((missing + 1))
            fi
          done <<< "$refs"
          echo "Verified product image references: $count"
          echo "Missing product images: $missing"
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check image-fix.js
          if [ -f i18n.js ]; then node --check i18n.js; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
