name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Repair critical UI bindings before deploy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Cart drawer needs a real backdrop because script.js controls #overlay.
          if 'id="overlay"' not in s:
              marker = '  <div class="search-overlay" id="searchOverlay"'
              replacement = '  <div class="overlay" id="overlay"></div>\n' + marker
              if marker not in s:
                  raise SystemExit("search overlay marker not found")
              s = s.replace(marker, replacement, 1)

          # Mobile navigation was rendered but its controls were not wired.
          if 'data-rock-mobile-bindings' not in s:
              marker = '  <script src="script.js?v=20260913-5"></script>'
              patch = '''  <script data-rock-mobile-bindings>
          (()=>{
            document.querySelectorAll('[data-jump]').forEach(btn=>btn.addEventListener('click',()=>{
              const target=document.querySelector(btn.dataset.jump);
              if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
            }));
            const mobileCart=document.getElementById('mobileCart');
            const cartBtn=document.getElementById('cartBtn');
            if(mobileCart&&cartBtn) mobileCart.addEventListener('click',()=>cartBtn.click());
            const mobileSearch=document.getElementById('mobileSearch');
            const searchBtn=document.getElementById('searchBtn');
            if(mobileSearch&&searchBtn) mobileSearch.addEventListener('click',()=>searchBtn.click());
          })();
          </script>
          ''' + marker
              if marker not in s:
                  raise SystemExit("script marker not found")
              s = s.replace(marker, patch, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate ROCK source and critical UI
        run: |
          test -s "rock_logo (1).svg"
          grep -q 'rock_logo%20(1).svg' index.html
          grep -q 'id="overlay"' index.html
          grep -q 'data-rock-mobile-bindings' index.html
          grep -q 'id="mobileCart"' index.html
          grep -q 'id="mobileSearch"' index.html
          grep -q 'id="cartBtn"' index.html
          grep -q 'id="searchBtn"' index.html
          grep -q 'id="cartDrawer"' index.html
          grep -q 'id="productGrid"' index.html
          grep -q 'id="finderModal"' index.html
          node --check script.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
