name: Deploy ROCK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Restore original ROCK logo asset
        run: |
          git show f0d715990ae10873a3eef2a871280afc299f9bc2:rock_logo_transparent.png > rock_logo_transparent.png
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "https://raw.githubusercontent.com/nashhal/ROCK/f0d715990ae10873a3eef2a871280afc299f9bc2/rock_logo_transparent.png"
          s = s.replace(old, "rock_logo_transparent.png?v=20260913-7")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
