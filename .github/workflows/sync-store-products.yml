          python - <<'PY'
          import os
          missing=[]
          for line in os.environ['PRODUCTS'].splitlines():
              if not line.strip():
                  continue
              code,name,cat,price,image=line.split('|')
              if not os.path.isfile(image):
                  missing.append(f'{code}: {image}')
          if missing:
              print('Missing approved product images:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print('All approved product image assets are present.')
          PY

