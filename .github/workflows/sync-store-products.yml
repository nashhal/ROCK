            WALL-45W|ROCK 45W GaN Type-C PD Wall Charger with Reinforced Cable|power|25|assets/products/wall45.webp
          PY
          python - <<'PY'
          import os,re
          path='script.js'
          text=open(path,encoding='utf-8').read()
          rows=[]
          for line in os.environ['PRODUCTS'].splitlines():
              if not line.strip():
                  continue
              code,name,cat,price,image=line.split('|')
              rows.append((code,name,cat,price,image))
          items=[]
          for code,name,cat,price,image in rows:
              items.append("{id:%r,image:%r,name:%r,category:%r,label:%r,desc:%r,price:%s,art:%r,badge:'PRICE LIST',rating:null,reviews:0,bestFor:[],specs:[]}"%(code,image,name,cat,cat.upper(),name,price,'product-art'))
          new='const products=[\n'+',\n'.join(items)+'\n];'
          pattern=r'const products=\[[\s\S]*?\n\];'
          updated,n=re.subn(pattern,new,text,count=1)
          if n!=1: raise SystemExit('Could not locate products array')
          open(path,'w',encoding='utf-8').write(updated)
          print('Products synced:',len(items))
          PY

      - name: Validate JavaScript
        run: node --check script.js

      - name: Commit catalog-only storefront
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m 'Show only approved ROCK 2026 price list products'
          git push
