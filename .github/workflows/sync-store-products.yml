            RKCH720|ROCK RKCH720 20W GaN Wall Charger|power|15|assets/products/rkch720.webp
            RKCH735|ROCK RKCH735 35W GaN Wall Charger|power|20|assets/products/rkch735.webp
            RKCH765|ROCK RKCH765 65W GaN Wall Charger|power|40|assets/products/rkch765.webp
            C43|ROCK C43 H30 30W Car Charger with Retractable Type-C Cable|power|46|assets/products/c43.webp
            SD-017|ROCK SD-017 H16 72W A+C PD Car Charger|power|40|assets/products/sd-017.webp
            NC-20|ROCK NC-20 H20 15W A+C Car Charger|power|12|assets/products/nc-20.webp
            RO-700W|ROCK Pods 700 Bluetooth Earphones White|audio|79|assets/products/ro-700w.webp
            RO-701W|ROCK Pods 701 Bluetooth Earphones White|audio|69|assets/products/ro-701w.webp
            RAU0785|ROCK EB TWS AI Smart Earphones White|audio|59|assets/products/rau0785.webp
            rau0785-black|ROCK EB TWS AI Smart Earphones Black|audio|59|assets/products/rau0785-black.webp
            RAU0788|ROCK EB710 Bluetooth Earphones White|audio|44|assets/products/rau0788.webp
            RAU0790|ROCK S1 Smart Touch TWS Earphones|audio|50|assets/products/s1.webp
            RAU0782|ROCK A5 Pro ANC TWS Smart Touch Screen Earphones|audio|65|assets/products/a5pro.webp
            HP-6030BT-S|ROCK 05 Wireless Headphones Silver|audio|46|assets/products/hp-6030bt-s.webp
            HP-6030BT-G|ROCK 05 Wireless Headphones Gray|audio|46|assets/products/hp-6030bt-g.webp
